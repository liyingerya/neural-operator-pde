[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "advection-diffusion"
version = "0.1.0"
description = "Verified NumPy solver for periodic 2D advection-diffusion"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
test = ["pytest>=7"]
ml = ["torch>=2.2,<3"]
evaluation = ["torch>=2.2,<3", "matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
include = ["advection_diffusion*", "dataset_generation*", "neural_operator*", "stage4_evaluation*", "stage5_training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
